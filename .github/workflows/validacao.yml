name: Validação do Conecta TI
on: [push, pull_request]
jobs:
  validacao:
    runs-on: ubuntu-latest
    env:
      CONECTA_ADMIN_SENHA: Somente-CI-Conecta-2026
      CONECTA_DADOS: ${{ runner.temp }}/conecta/evento.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/ConectaTI -c Release
      - run: dotnet run --project tests/ConectaTI.Checks -c Release
      - name: Exercitar fluxo HTTP
        run: |
          dotnet run --project src/ConectaTI -c Release --no-build --urls http://127.0.0.1:5178 > servidor.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:5178/
          python3 tests/fluxo_http.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar navegador de teste
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verificar responsividade
        run: |
          dotnet run --project src/ConectaTI -c Release --no-build --urls http://127.0.0.1:5178 > servidor.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:5178/
          mkdir -p capturas
          CONECTA_CAPTURAS=capturas node tests/responsividade.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-responsividade
          path: capturas/
